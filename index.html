<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <title>AR Turismo Ubaté</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #change {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 12px 24px;
      background: white;
      border: 2px solid #333;
      border-radius: 25px;
      font-weight: bold;
    }

    /* Estilo para asegurar que el canvas no se deforme */
    canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      /* Mantiene la proporción sin estirar, ideal para calidad alta */
    }
  </style>
</head>

<body>
  <button id="change">CAMBIAR MODELO</button>

  <a-scene embedded vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false; displayWidth: 1280; displayHeight: 720; fitWebcamToWindow: true; trackingMethod: best;">

    <a-marker type="pattern" url="pattern-parroquia_29-01-2020_45W0Q7H1kpbasilica%20santo%20cristo%20ubate.patt">
      <a-entity id="img" gltf-model="proyecto_cultura.glb" scale="3 3 3" position="0 0 0" rotation="0 0 0">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const btn = document.getElementById("change");
    const modelEntity = document.getElementById("img");
    let isOriginal = true;

    btn.addEventListener("click", function () {
      if (isOriginal) {
        modelEntity.setAttribute("gltf-model", "Astronaut.glb");
        modelEntity.setAttribute("scale", "0.5 0.5 0.5");
      } else {
        modelEntity.setAttribute("gltf-model", "proyecto_cultura.glb");
        modelEntity.setAttribute("scale", "1 1 1");
      }
      isOriginal = !isOriginal;
    });

    // Función crítica para recalcular el tamaño sin deformar
    function resizeAR() {
      const scene = document.querySelector('a-scene');
      const container = scene.parentElement;
      const video = document.querySelector('#arjs-video');

      if (video) {
        // Forzamos que el video no se estire manualmente
        video.style.width = window.innerWidth + 'px';
        video.style.height = window.innerHeight + 'px';
        video.style.objectFit = 'cover';
      }
    }

    window.addEventListener('resize', resizeAR);
    // Ejecutar después de un momento para asegurar que AR.js cargó el video
    setTimeout(resizeAR, 2000);
  </script>
</body>

</html>
