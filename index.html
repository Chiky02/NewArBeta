<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <title>AR Turismo Ubaté</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>

  <style>
    /* Eliminamos márgenes para que la cámara ocupe el 100% */
    body {
      margin: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: sans-serif;
    }

    /* Botón flotante con mejor diseño para móviles */
    #change {
      position: absolute;
      bottom: 30px;
      /* Movido abajo para que sea más fácil de tocar con el pulgar */
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 15px 30px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #333;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    #change:active {
      background: #eee;
    }
  </style>
</head>

<body>
  <button id="change">CAMBIAR MODELO</button>

  <a-scene vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-marker type="pattern" url="pattern-parroquia_29-01-2020_45W0Q7H1kpbasilica%20santo%20cristo%20ubate.patt">

      <a-entity id="img" gltf-model="proyecto_cultura.glb" scale="1 1 1" position="0 0 0" rotation="0 0 0">
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Lógica para alternar entre modelos
    const btn = document.getElementById("change");
    const modelEntity = document.getElementById("img");
    let isOriginal = true;

    btn.addEventListener("click", function () {
      if (isOriginal) {
        modelEntity.setAttribute("gltf-model", "Astronaut.glb");
        // Puedes ajustar la escala si el astronauta es muy pequeño o grande
        modelEntity.setAttribute("scale", "0.5 0.5 0.5");
      } else {
        modelEntity.setAttribute("gltf-model", "proyecto_cultura.glb");
        modelEntity.setAttribute("scale", "1 1 1");
      }
      isOriginal = !isOriginal;
    });

    // Pequeño hack para forzar el resize en móviles al cargar
    window.addEventListener('load', () => {
      setTimeout(() => {
        window.dispatchEvent(new Event('resize'));
      }, 1000);
    });
  </script>
</body>

</html>
