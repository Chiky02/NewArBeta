<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <title>AR Turismo Ubaté</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #change {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      padding: 12px 20px;
      background: white;
      border: 2px solid #333;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    .controls {
      position: absolute;
      right: 15px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 1000;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.8);
      padding: 10px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .grid-rotation {
      display: grid;
      grid-template-columns: repeat(3, 40px);
      gap: 5px;
      margin-top: 5px;
    }

    .btn-ctrl {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid #333;
      background: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-ctrl:active {
      background: #ccc;
    }

    .label {
      font-size: 9px;
      text-transform: uppercase;
      font-weight: bold;
      color: #333;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div class="controls">
    <div class="control-group">
      <span class="label">Tamaño</span>
      <div style="display: flex; gap: 5px; margin-top: 5px;">
        <button class="btn-ctrl" onclick="adjustScale(1.1)">+</button>
        <button class="btn-ctrl" onclick="adjustScale(0.9)">-</button>
      </div>
    </div>

    <div class="control-group">
      <span class="label">Rotación</span>
      <div class="grid-rotation">
        <div></div>
        <button class="btn-ctrl" onclick="adjustRotation('x', -15)">▲</button>
        <div></div>

        <button class="btn-ctrl" onclick="adjustRotation('y', -15)">◀</button>
        <button class="btn-ctrl" onclick="adjustRotation('x', 15)">▼</button>
        <button class="btn-ctrl" onclick="adjustRotation('y', 15)">▶</button>
      </div>
    </div>
  </div>

  <button id="change">CAMBIAR MODELO</button>

  <a-scene embedded vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false; displayWidth: 1280; displayHeight: 720; fitWebcamToWindow: true;">

    <a-marker type="pattern" url="pattern-parroquia_29-01-2020_45W0Q7H1kpbasilica%20santo%20cristo%20ubate.patt">
      <a-entity id="img" gltf-model="proyecto_cultura.glb" scale="1 1 1" position="0 0 0" rotation="0 0 0">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const btn = document.getElementById("change");
    const modelEntity = document.getElementById("img");
    let isOriginal = true;

    btn.addEventListener("click", function () {
      if (isOriginal) {
        modelEntity.setAttribute("gltf-model", "Astronaut.glb");
        modelEntity.setAttribute("scale", "0.5 0.5 0.5");
      } else {
        modelEntity.setAttribute("gltf-model", "proyecto_cultura.glb");
        modelEntity.setAttribute("scale", "1 1 1");
      }
      isOriginal = !isOriginal;
      modelEntity.setAttribute("rotation", "0 0 0");
    });

    function adjustScale(factor) {
      const s = modelEntity.getAttribute("scale");
      modelEntity.setAttribute("scale", { x: s.x * factor, y: s.y * factor, z: s.z * factor });
    }

    /**
     * AJUSTE DE ROTACIÓN
     * Eje X: Inclinación (arriba/abajo)
     * Eje Y: Giro horizontal (sobre su propio eje vertical)
     */
    function adjustRotation(axis, angle) {
      // Obtenemos la rotación actual como un objeto
      let r = modelEntity.getAttribute("rotation");

      if (axis === 'x') {
        // Modifica la inclinación sin tocar el giro lateral
        modelEntity.setAttribute("rotation", { x: r.x + angle, y: r.y, z: r.z });
      } else if (axis === 'y') {
        // Modifica el giro lateral manteniendo la inclinación actual
        modelEntity.setAttribute("rotation", { x: r.x, y: r.y, z: r.z + -angle });
      }
    }

    function resizeAR() {
      const video = document.querySelector('#arjs-video');
      if (video) {
        video.style.width = window.innerWidth + 'px';
        video.style.height = window.innerHeight + 'px';
        video.style.objectFit = 'cover';
      }
    }

    window.addEventListener('resize', resizeAR);
    setTimeout(resizeAR, 2000);
  </script>
</body>

</html>
